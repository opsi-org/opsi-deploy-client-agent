[build-system]
requires = [ "poetry>=0.12",]
build-backend = "poetry.masonry.api"

[tool.poetry]
name = "opsi-deploy-client-agent"
version = "4.4.0.0"
description = "tool to deploy the opsi-client-agent on linux, windows and macOS clients"
homepage = "https://www.opsi.org"
license = "AGPL-3.0"
authors = [ "uib GmbH <info@uib.de>",]
maintainers = [ "uib GmbH <info@uib.de>",]
[[tool.poetry.packages]]
include = "opsideployclientagent"

[[tool.poetry.source]]
name = "uib"
url = "https://pypi.uib.gmbh/simple/"
priority = "primary"

[[tool.poetry.source]]
name = "PyPI"

[tool.ruff]
line-length = 140

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
python-opsi-common = "^4.4.0.8"
paramiko = "^3.5"
impacket = "^0.10"
smbprotocol = "^1.9"
python-opsi = "^4.4"

[tool.poetry.scripts]
opsi-deploy-client-agent = "opsideployclientagent.__main__:main"

[tool.ruff.format]
indent-style = "tab"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8"
pytest = "^7.0"
pyinstaller = "^6.0"
mypy = "^1.1"
