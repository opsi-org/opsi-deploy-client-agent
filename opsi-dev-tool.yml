pyinstaller:
  one_file: yes
  strip: yes
  hidden_imports:
    all:
      - paramiko
      - gssapi
  extra_args:
    darwin:
      - --exclude-module
      - tkinter
  scripts:
    - script: opsideployclientagent/__main__.py
      binaries:
        - opsi-deploy-client-agent
